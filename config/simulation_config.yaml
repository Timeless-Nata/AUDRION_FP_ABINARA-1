# Parameters of the MuJoCo simulation node (loaded into its private namespace).
# model_path is NOT set here: it is the launch argument `model_path`.
keyframe: home                 # keyframe in scene.xml used at start / reset ("" = default pose)
realtime_factor: 1.0           # simulated seconds per wall-clock second
joint_states_rate: 100.0       # Hz
render: true                   # GLFW viewer window (set false for headless)
render_rate: 60.0              # Hz
start_paused: false
joint_states_topic: /arm/joint_states
joint_command_topic: /arm/joint_command
